name: CI/CD Pipeline

# 個人開発前提のため main のみを対象にする（v3.7.8〜）
# develop branch は使わないため除外。pull_request は PR運用ON（sc:enable-pr）時のために残してある
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチへの連続 push で古い run を走らせ続けない（Actions 分数の節約）。
# 後から来た push が正なので、キューイングではなく打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: コード品質チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 依存関係インストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: フィーチャー境界チェック
        run: pnpm check:boundaries

      - name: 全体チェック
        run: |
          cp .env.ci .env.local 2>/dev/null || true
          pnpm check

  test:
    name: テスト実行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 依存関係インストール
        run: pnpm install --frozen-lockfile

      - name: 単体テスト + カバレッジ計測
        run: pnpm test:coverage

      - name: カバレッジレポートをアーティファクト化
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: ビルドチェック
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: 依存関係インストール
        run: pnpm install --frozen-lockfile

      - name: プロダクションビルド
        run: pnpm build

      - name: Preflightチェック
        run: pnpm preflight
